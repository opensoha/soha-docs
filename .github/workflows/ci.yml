name: docs-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soha-docs
    steps:
      - uses: actions/checkout@v7
        with:
          path: soha-docs
      - uses: actions/checkout@v7
        with:
          repository: opensoha/soha
          ref: f160aa3ae7fc0d7e9215cc0f330f88cabad084d8 # Published SDK contracts/v0.2.0
          path: soha
          sparse-checkout: contracts
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: soha-docs/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run screenshots:check
