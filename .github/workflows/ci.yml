name: docs-ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soha-docs
    steps:
      - uses: actions/checkout@v7
        with:
          path: soha-docs
      - uses: actions/checkout@v7
        with:
          repository: opensoha/soha
          ref: 3d8938200237ed3349b8c43c158374da40a35bbe # Root SDK source candidate; not a published new namespace
          path: soha
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: soha-docs/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run screenshots:check
